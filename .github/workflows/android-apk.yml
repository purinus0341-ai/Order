name: Android APK Build and Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
          cache-disabled: true

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew || true

      - name: Configure stable APK signing key
        env:
          ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_SIGNING_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::error::Configure ANDROID_SIGNING_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD in GitHub Actions Secrets before building APKs."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/order-signing"
          echo "$ANDROID_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/order-signing/order-signing.jks"
          chmod 600 "$RUNNER_TEMP/order-signing/order-signing.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/order-signing/order-signing.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
          keytool -list -keystore "$RUNNER_TEMP/order-signing/order-signing.jks" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null

      - name: Determine Version Metadata
        id: version_meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            RAW_TAG="${{ github.ref_name }}"
            VER_NAME="${RAW_TAG#v}"
            VER_CODE="${{ github.run_number }}"
            echo "TAG_NAME=${RAW_TAG}" >> $GITHUB_ENV
            echo "RELEASE_NAME=OrderApp Release ${RAW_TAG}" >> $GITHUB_ENV
          else
            VER_NAME="1.0.${{ github.run_number }}"
            VER_CODE="${{ github.run_number }}"
            echo "TAG_NAME=v${VER_NAME}" >> $GITHUB_ENV
            echo "RELEASE_NAME=OrderApp Build #${{ github.run_number }} (v${VER_NAME})" >> $GITHUB_ENV
          fi
          echo "APP_VERSION_NAME=${VER_NAME}" >> $GITHUB_ENV
          echo "APP_VERSION_CODE=${VER_CODE}" >> $GITHUB_ENV

      - name: Validate Supabase configuration
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "::error::GitHub Actions secret SUPABASE_URL is missing"
            exit 1
          fi
          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::GitHub Actions secret SUPABASE_ANON_KEY is missing"
            exit 1
          fi
          if [[ "$SUPABASE_URL" != "https://pafgvntgilogmxfrjamp.supabase.co" ]]; then
            echo "::error::SUPABASE_URL must point to the Ordernew project"
            exit 1
          fi

      - name: Assemble Debug APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VERSION_NAME: ${{ env.APP_VERSION_NAME }}
          VERSION_CODE: ${{ env.APP_VERSION_CODE }}
        run: |
          gradle assembleDebug -PversionName="${{ env.APP_VERSION_NAME }}" -PversionCode="${{ env.APP_VERSION_CODE }}" --stacktrace

      - name: Prepare APK for Artifact & Release
        id: prepare_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug/ -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::No APK found in app/build/outputs/apk/debug/"
            exit 1
          fi
          echo "Found APK at $APK_PATH"
          cp "$APK_PATH" OrderApp-debug.apk
          echo "apk_file=OrderApp-debug.apk" >> $GITHUB_OUTPUT

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OrderApp-debug-apk
          path: OrderApp-debug.apk
          retention-days: 30

      - name: Publish APK to GitHub Releases
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.RELEASE_NAME }}
          body: |
            ### OrderApp POS & Stock Management (Android Native ${{ env.TAG_NAME }})
            - **Version:** ${{ env.APP_VERSION_NAME }} (Build #${{ env.APP_VERSION_CODE }})
            - **Commit:** ${{ github.sha }}
            - **Branch/Ref:** ${{ github.ref_name }}
            - **Platform:** Android (MinSdk 26, TargetSdk 34)
            - **Theme:** Pastel Redesign (Mint / Peach / Lavender)
            
            #### Core Features:
            - Supabase Auth & Profile Active Guard
            - POS Checkout with Free Items & Points Redemption
            - Offline Outbox with Idempotency Key & Device ID
            - Held Bills & Local Cart Draft
            - Customers & Points History
            - Order History & Atomic Void with Reason
            - Stock Management & Low-Stock Alerts (LINE Notify via Edge Function)
            - Image Counter Canvas with Marker Toolbar
            - Admin Dashboard, User Management & Sync Diagnostics
          files: OrderApp-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
