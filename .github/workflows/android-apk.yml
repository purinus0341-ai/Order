name: Android APK Build and Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK (stable signing key required)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Protect test build branch
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" != "refs/heads/chore/ordernew-stable-keystore" ] && [ "${GITHUB_REF}" != "refs/heads/fix/offline-data-reliability" ]; then
            echo "::error::Test builds must be dispatched from an approved test branch. No build, commit, push, or release was performed."
            exit 1
          fi

      - name: Set up Node.js for database tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test notes migration
        run: |
          npm ci --prefix supabase/tests --ignore-scripts
          npm test --prefix supabase/tests

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
          cache-disabled: true

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew || true

      - name: Validate and decode stable Android signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required GitHub Actions secret $name is missing. Refusing to generate a replacement signing key."
              exit 1
            fi
          done
          KEYSTORE_PATH="$RUNNER_TEMP/ordernew-signing.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          if [ ! -s "$KEYSTORE_PATH" ]; then
            echo "::error::Decoded keystore is empty"
            exit 1
          fi
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "Stable signing keystore validated (secret values are not printed)."

      - name: Determine Version Metadata
        id: version_meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            RAW_TAG="${{ github.ref_name }}"
            VER_NAME="${RAW_TAG#v}"
            VER_CODE="${{ github.run_number }}"
            echo "TAG_NAME=${RAW_TAG}" >> "$GITHUB_ENV"
            echo "RELEASE_NAME=OrderApp Release ${RAW_TAG}" >> "$GITHUB_ENV"
          else
            VER_NAME="1.0.${{ github.run_number }}"
            VER_CODE="${{ github.run_number }}"
            echo "TAG_NAME=v${VER_NAME}" >> "$GITHUB_ENV"
            echo "RELEASE_NAME=OrderApp Build #${{ github.run_number }} (v${VER_NAME})" >> "$GITHUB_ENV"
          fi
          echo "APP_VERSION_NAME=${VER_NAME}" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=${VER_CODE}" >> "$GITHUB_ENV"

      - name: Validate Supabase configuration
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_URL" ]; then
            echo "::error::GitHub Actions secret SUPABASE_URL is missing"
            exit 1
          fi
          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::GitHub Actions secret SUPABASE_ANON_KEY is missing"
            exit 1
          fi
          if [[ "$SUPABASE_URL" != "https://pafgvntgilogmxfrjamp.supabase.co" ]]; then
            echo "::error::SUPABASE_URL must point to the Ordernew project"
            exit 1
          fi

      - name: Assemble Debug APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VERSION_NAME: ${{ env.APP_VERSION_NAME }}
          VERSION_CODE: ${{ env.APP_VERSION_CODE }}
          ANDROID_KEYSTORE_PATH: ${{ env.ANDROID_KEYSTORE_PATH }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle testDebugUnitTest assembleDebug -PversionName="${{ env.APP_VERSION_NAME }}" -PversionCode="${{ env.APP_VERSION_CODE }}" --stacktrace

      - name: Verify APK signature and package identity
        run: |
          set -euo pipefail
          APK_PATH=$(find app/build/outputs/apk/debug/ -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::No APK found in app/build/outputs/apk/debug/"
            exit 1
          fi
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner not found in Android SDK Build-Tools"
            exit 1
          fi
          "$APKSIGNER" verify --print-certs "$APK_PATH"
          echo "APK output found and signature verification completed."

      - name: Prepare APK for Artifact & Release
        id: prepare_apk
        run: |
          set -euo pipefail
          APK_PATH=$(find app/build/outputs/apk/debug/ -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::No APK found in app/build/outputs/apk/debug/"
            exit 1
          fi
          cp "$APK_PATH" OrderApp-debug.apk
          echo "apk_file=OrderApp-debug.apk" >> "$GITHUB_OUTPUT"

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OrderApp-debug-apk
          path: OrderApp-debug.apk
          retention-days: 30

      - name: Publish APK to GitHub Releases
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.RELEASE_NAME }}
          body: |
            ### OrderApp POS & Stock Management (Android Native ${{ env.TAG_NAME }})
            - **Version:** ${{ env.APP_VERSION_NAME }} (Build #${{ env.APP_VERSION_CODE }})
            - **Commit:** ${{ github.sha }}
            - **Branch/Ref:** ${{ github.ref_name }}
            - **Platform:** Android (MinSdk 26, TargetSdk 34)
            - **Theme:** Pastel Redesign (Mint / Peach / Lavender)

            #### Core Features:
            - Supabase Auth & Profile Active Guard
            - POS Checkout with Free Items & Points Redemption
            - Offline Outbox with Idempotency Key & Device ID
            - Held Bills & Local Cart Draft
            - Customers & Points History
            - Order History & Atomic Void with Reason
            - Stock Management & Low-Stock Alerts (LINE Notify via Edge Function)
            - Image Counter Canvas with Marker Toolbar
            - Admin Dashboard, User Management & Sync Diagnostics
          files: OrderApp-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
