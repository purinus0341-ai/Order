name: Android APK Build and Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
          cache-disabled: true

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew || true

      - name: Assemble Debug APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          gradle assembleDebug --stacktrace > build.log 2>&1

      - name: Capture Failure Log
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B build-logs
          cp build.log error.log
          git add error.log
          git commit -m "Capture build failure log" || true
          git push origin build-logs --force

      - name: Prepare APK for Artifact & Release
        id: prepare_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug/ -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::No APK found in app/build/outputs/apk/debug/"
            exit 1
          fi
          echo "Found APK at $APK_PATH"
          cp "$APK_PATH" OrderApp-debug.apk
          echo "apk_file=OrderApp-debug.apk" >> $GITHUB_OUTPUT

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OrderApp-debug-apk
          path: OrderApp-debug.apk
          retention-days: 30

      - name: Set Release Metadata
        id: release_meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "TAG_NAME=${{ github.ref_name }}" >> $GITHUB_ENV
            echo "RELEASE_NAME=OrderApp Release ${{ github.ref_name }}" >> $GITHUB_ENV
          else
            echo "TAG_NAME=v1.0.${{ github.run_number }}" >> $GITHUB_ENV
            echo "RELEASE_NAME=OrderApp Build #${{ github.run_number }}" >> $GITHUB_ENV
          fi

      - name: Publish APK to GitHub Releases
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.RELEASE_NAME }}
          body: |
            ### OrderApp POS & Stock Management (Android Native)
            - **Commit:** ${{ github.sha }}
            - **Branch/Ref:** ${{ github.ref_name }}
            - **Platform:** Android (MinSdk 26, TargetSdk 34)
            - **Theme:** Pastel Redesign (Mint / Peach / Lavender)
            
            #### Core Features:
            - Supabase Auth & Profile Active Guard
            - POS Checkout with Free Items & Points Redemption
            - Offline Outbox with Idempotency Key & Device ID
            - Held Bills & Local Cart Draft
            - Customers & Points History
            - Order History & Atomic Void with Reason
            - Stock Management & Low-Stock Alerts (LINE Notify via Edge Function)
            - Image Counter Canvas with Marker Toolbar
            - Admin Dashboard, User Management & Sync Diagnostics
          files: OrderApp-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
