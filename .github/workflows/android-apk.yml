              captured_at,
              note,
              source_device_id,
              created_by,
              idempotency_key
            ) values (
              v_id,
              v_captured_at,
              nullif(p_snapshot ->> 'note', ''),
              nullif(p_snapshot ->> 'source_device_id', ''),
              v_user_id,
              v_key
            );
          
