name: Install Notes Feature & Build APK

on:
  workflow_dispatch:
    inputs:
      commit_to_repo:
        description: 'Commit และ Push โค้ดระบบจดโน้ตลง Repository อัตโนมัติ'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  install-notes-and-build:
    name: Setup Notes System & Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate & Patch Notes System Files
        run: |
          set -e
          
          echo '=========================================='
          echo ' กำลังติดตั้งระบบสมุดโน้ต (Notes System) '
          echo '=========================================='
          
          # ตรวจสอบว่าอยู่ในโฟลเดอร์โปรเจกต์หรือไม่
          if [ ! -d "app/src/main/java/com/sitticun/orderapp" ]; then
            echo '❌ ไม่พบโฟลเดอร์ app/src/main/java/com/sitticun/orderapp'
            echo 'กรุณารันสคริปต์นี้ในโฟลเดอร์หลักของโปรเจกต์ Order (ที่มีไฟล์ settings.gradle.kts)'
            exit 1
          fi
          
          mkdir -p app/src/main/java/com/sitticun/orderapp/data/model
          mkdir -p app/src/main/java/com/sitticun/orderapp/data/repository
          mkdir -p app/src/main/java/com/sitticun/orderapp/ui/screens/notes
          
          echo '📄 กำลังเขียนไฟล์ app/src/main/java/com/sitticun/orderapp/data/model/NoteModel.kt ...'
          cat << 'EOF_FILE_CONTENT' > "app/src/main/java/com/sitticun/orderapp/data/model/NoteModel.kt"
          package com.sitticun.orderapp.data.model
          
          import kotlinx.serialization.SerialName
          import kotlinx.serialization.Serializable
          import java.util.UUID
          
          @Serializable
          data class NoteModel(
              val id: String = UUID.randomUUID().toString(),
              val title: String,
              val content: String,
              @SerialName("is_pinned") val isPinned: Boolean = false,
              @SerialName("created_by") val createdBy: String? = null,
              @SerialName("updated_at") val updatedAt: String = ""
          )
          EOF_FILE_CONTENT
          
          echo '📄 กำลังเขียนไฟล์ app/src/main/java/com/sitticun/orderapp/data/repository/NoteRepository.kt ...'
          cat << 'EOF_FILE_CONTENT' > "app/src/main/java/com/sitticun/orderapp/data/repository/NoteRepository.kt"
          package com.sitticun.orderapp.data.repository
          
          import com.sitticun.orderapp.data.api.SupabaseClient
          import com.sitticun.orderapp.data.local.OrderDatabaseHelper
          import com.sitticun.orderapp.data.local.PreferenceManager
          import com.sitticun.orderapp.data.model.NoteModel
          import com.sitticun.orderapp.util.Formatters
          import com.sitticun.orderapp.util.NetworkMonitor
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import java.util.UUID
          
          class NoteRepository(
              private val supabaseClient: SupabaseClient,
              private val dbHelper: OrderDatabaseHelper,
              private val preferenceManager: PreferenceManager,
              private val networkMonitor: NetworkMonitor
          ) {
              suspend fun getLocalNotes(): List<NoteModel> = withContext(Dispatchers.IO) {
                  dbHelper.getAllNotes()
              }
          
              suspend fun syncNotes(): List<NoteModel> = withContext(Dispatchers.IO) {
                  if (networkMonitor.isOnline) {
                      val res = supabaseClient.getNotes()
                      if (res.isSuccess) {
                          val remoteNotes = res.getOrDefault(emptyList())
                          dbHelper.saveNotes(remoteNotes)
                      }
                  }
                  dbHelper.getAllNotes()
              }
          
              suspend fun saveNote(
                  title: String,
                  content: String,
                  isPinned: Boolean,
                  existingId: String? = null
              ): NoteModel = withContext(Dispatchers.IO) {
                  val currentUserId = preferenceManager.userProfile?.userId
                  val note = NoteModel(
                      id = existingId ?: UUID.randomUUID().toString(),
                      title = title.trim().ifBlank { "ไม่มีหัวข้อ" },
                      content = content.trim(),
                      isPinned = isPinned,
                      createdBy = currentUserId,
                      updatedAt = Formatters.getCurrentIsoTimestamp()
                  )
                  dbHelper.upsertNote(note)
                  if (networkMonitor.isOnline) {
                      supabaseClient.upsertNote(note)
                  }
                  note
              }
          
              suspend fun togglePin(note: NoteModel) = withContext(Dispatchers.IO) {
                  val updated = note.copy(
                      isPinned = !note.isPinned,
                      updatedAt = Formatters.getCurrentIsoTimestamp()
                  )
                  dbHelper.upsertNote(updated)
                  if (networkMonitor.isOnline) {
                      supabaseClient.upsertNote(updated)
                  }
              }
          
              suspend fun deleteNote(id: String) = withContext(Dispatchers.IO) {
                  dbHelper.deleteNote(id)
                  if (networkMonitor.isOnline) {
                      supabaseClient.deleteNote(id)
                  }
              }
          }
          EOF_FILE_CONTENT
          
          echo '📄 กำลังเขียนไฟล์ app/src/main/java/com/sitticun/orderapp/ui/screens/notes/NotesViewModel.kt ...'
          cat << 'EOF_FILE_CONTENT' > "app/src/main/java/com/sitticun/orderapp/ui/screens/notes/NotesViewModel.kt"
          package com.sitticun.orderapp.ui.screens.notes
          
          import androidx.lifecycle.ViewModel
          import androidx.lifecycle.ViewModelProvider
          import androidx.lifecycle.viewModelScope
          import com.sitticun.orderapp.OrderApplication
          import com.sitticun.orderapp.data.model.NoteModel
          import com.sitticun.orderapp.data.repository.NoteRepository
          import kotlinx.coroutines.flow.MutableStateFlow
          import kotlinx.coroutines.flow.SharingStarted
          import kotlinx.coroutines.flow.StateFlow
          import kotlinx.coroutines.flow.asStateFlow
          import kotlinx.coroutines.flow.combine
          import kotlinx.coroutines.flow.stateIn
          import kotlinx.coroutines.launch
          
          class NotesViewModel(
              private val repository: NoteRepository
          ) : ViewModel() {
          
              private val _notes = MutableStateFlow<List<NoteModel>>(emptyList())
              private val _searchQuery = MutableStateFlow("")
              val searchQuery: StateFlow<String> = _searchQuery.asStateFlow()
          
              private val _isRefreshing = MutableStateFlow(false)
              val isRefreshing: StateFlow<Boolean> = _isRefreshing.asStateFlow()
          
              val filteredNotes: StateFlow<List<NoteModel>> = combine(_notes, _searchQuery) { notes, query ->
                  if (query.isBlank()) {
                      notes
                  } else {
                      val q = query.trim().lowercase()
                      notes.filter {
                          it.title.lowercase().contains(q) || it.content.lowercase().contains(q)
                      }
                  }
              }.stateIn(viewModelScope, SharingStarted.WhileSubscribed(5000), emptyList())
          
              init {
                  loadLocalNotes()
                  syncNotes()
              }
          
              fun loadLocalNotes() {
                  viewModelScope.launch {
                      _notes.value = repository.getLocalNotes()
                  }
              }
          
              fun syncNotes() {
                  viewModelScope.launch {
                      _isRefreshing.value = true
                      _notes.value = repository.syncNotes()
                      _isRefreshing.value = false
                  }
              }
          
              fun onSearchQueryChange(query: String) {
                  _searchQuery.value = query
              }
          
              fun saveNote(title: String, content: String, isPinned: Boolean, existingId: String? = null) {
                  if (title.isBlank() && content.isBlank()) return
                  viewModelScope.launch {
                      repository.saveNote(
                          title = title,
                          content = content,
                          isPinned = isPinned,
                          existingId = existingId
                      )
                      _notes.value = repository.getLocalNotes()
                  }
              }
          
              fun togglePin(note: NoteModel) {
                  viewModelScope.launch {
                      repository.togglePin(note)
                      _notes.value = repository.getLocalNotes()
                  }
              }
          
              fun deleteNote(id: String) {
                  viewModelScope.launch {
                      repository.deleteNote(id)
                      _notes.value = repository.getLocalNotes()
                  }
              }
          
              class Factory : ViewModelProvider.Factory {
                  @Suppress("UNCHECKED_CAST")
                  override fun <T : ViewModel> create(modelClass: Class<T>): T {
                      return NotesViewModel(OrderApplication.instance.noteRepository) as T
                  }
              }
          }
          EOF_FILE_CONTENT
          
          echo '📄 กำลังเขียนไฟล์ app/src/main/java/com/sitticun/orderapp/ui/screens/notes/NotesScreen.kt ...'
          cat << 'EOF_FILE_CONTENT' > "app/src/main/java/com/sitticun/orderapp/ui/screens/notes/NotesScreen.kt"
          package com.sitticun.orderapp.ui.screens.notes
          
          import androidx.compose.foundation.background
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.style.TextOverflow
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import androidx.compose.ui.window.Dialog
          import androidx.lifecycle.viewmodel.compose.viewModel
          import com.sitticun.orderapp.data.model.NoteModel
          import com.sitticun.orderapp.ui.components.IosNavigationHeader
          import com.sitticun.orderapp.ui.components.IosSearchBar
          import com.sitticun.orderapp.ui.theme.*
          import com.sitticun.orderapp.util.Formatters
          
          @Composable
          fun NotesScreen(
              viewModel: NotesViewModel = viewModel(factory = NotesViewModel.Factory())
          ) {
              val notes by viewModel.filteredNotes.collectAsState()
              val searchQuery by viewModel.searchQuery.collectAsState()
              val isRefreshing by viewModel.isRefreshing.collectAsState()
          
              var showEditorDialog by remember { mutableStateOf(false) }
              var editingNote by remember { mutableStateOf<NoteModel?>(null) }
              var noteToDelete by remember { mutableStateOf<NoteModel?>(null) }
          
              Box(
                  modifier = Modifier
                      .fillMaxSize()
                      .background(IosGroupedBackground)
              ) {
                  Column(modifier = Modifier.fillMaxSize()) {
                      IosNavigationHeader(
                          title = "สมุดโน้ต",
                          subtitle = "จดบันทึกร้าน แจ้งเตือนกะถัดไป และรายการกันลืม (${notes.size} รายการ)",
                          trailingContent = {
                              Surface(
                                  shape = RoundedCornerShape(50),
                                  color = IosBlueLight,
                                  modifier = Modifier
                                      .clip(RoundedCornerShape(50))
                                      .clickable { viewModel.syncNotes() }
                              ) {
                                  Row(
                                      modifier = Modifier.padding(horizontal = 12.dp, vertical = 6.dp),
                                      verticalAlignment = Alignment.CenterVertically,
                                      horizontalArrangement = Arrangement.spacedBy(4.dp)
                                  ) {
                                      if (isRefreshing) {
                                          CircularProgressIndicator(
                                              color = IosBlue,
                                              modifier = Modifier.size(14.dp),
                                              strokeWidth = 2.dp
                                          )
                                      } else {
                                          Icon(
                                              imageVector = Icons.Default.Sync,
                                              contentDescription = "ซิงค์",
                                              tint = IosBlue,
                                              modifier = Modifier.size(16.dp)
                                          )
                                      }
                                      Text(
                                          text = "ซิงค์",
                                          color = IosBlue,
                                          fontSize = 12.sp,
                                          fontWeight = FontWeight.SemiBold
                                      )
                                  }
                              }
                          },
                          bottomContent = {
                              IosSearchBar(
                                  query = searchQuery,
                                  onQueryChange = { viewModel.onSearchQueryChange(it) },
                                  placeholder = "ค้นหาหัวข้อ หรือเนื้อหาโน้ต...",
                                  modifier = Modifier.fillMaxWidth()
                              )
                          }
                      )
          
                      if (notes.isEmpty()) {
                          Box(
                              modifier = Modifier
                                  .weight(1f)
                                  .fillMaxWidth()
                                  .padding(24.dp),
                              contentAlignment = Alignment.Center
                          ) {
                              Column(horizontalAlignment = Alignment.CenterHorizontally) {
                                  Box(
                                      modifier = Modifier
                                          .size(64.dp)
                                          .clip(CircleShape)
                                          .background(IosBlueLight),
                                      contentAlignment = Alignment.Center
                                  ) {
                                      Icon(
                                          imageVector = Icons.Default.EditNote,
                                          contentDescription = null,
                                          tint = IosBlue,
                                          modifier = Modifier.size(34.dp)
                                      )
                                  }
                                  Spacer(modifier = Modifier.height(12.dp))
                                  Text(
                                      text = if (searchQuery.isBlank()) "ยังไม่มีรายการจดโน้ต" else "ไม่พบโน้ตที่ค้นหา",
                                      fontWeight = FontWeight.Bold,
                                      fontSize = 16.sp,
                                      color = TextPrimary
                                  )
                                  Spacer(modifier = Modifier.height(4.dp))
                                  Text(
                                      text = if (searchQuery.isBlank()) "แตะปุ่ม + มุมขวาล่างเพื่อสร้างโน้ตใหม่" else "ลองค้นหาด้วยคำสำคัญอื่น",
                                      fontSize = 13.sp,
                                      color = TextSecondary
                                  )
                              }
                          }
                      } else {
                          LazyColumn(
                              modifier = Modifier
                                  .weight(1f)
                                  .fillMaxWidth(),
                              contentPadding = PaddingValues(start = 14.dp, end = 14.dp, top = 12.dp, bottom = 92.dp),
                              verticalArrangement = Arrangement.spacedBy(10.dp)
                          ) {
                              items(notes, key = { it.id }) { note ->
                                  NoteCardItem(
                                      note = note,
                                      onClick = {
                                          editingNote = note
                                          showEditorDialog = true
                                      },
                                      onTogglePin = { viewModel.togglePin(note) },
                                      onDelete = { noteToDelete = note }
                                  )
                              }
                          }
                      }
                  }
          
                  FloatingActionButton(
                      onClick = {
                          editingNote = null
                          showEditorDialog = true
                      },
                      containerColor = IosBlue,
                      contentColor = Color.White,
                      shape = CircleShape,
                      modifier = Modifier
                          .align(Alignment.BottomEnd)
                          .padding(20.dp)
                  ) {
                      Icon(Icons.Default.Add, contentDescription = "เพิ่มโน้ต")
                  }
              }
          
              if (showEditorDialog) {
                  NoteEditorDialog(
                      initialNote = editingNote,
                      onDismiss = { showEditorDialog = false },
                      onSave = { title, content, isPinned ->
                          viewModel.saveNote(
                              title = title,
                              content = content,
                              isPinned = isPinned,
                              existingId = editingNote?.id
                          )
                          showEditorDialog = false
                      }
                  )
              }
          
              noteToDelete?.let { note ->
                  AlertDialog(
                      onDismissRequest = { noteToDelete = null },
                      title = { Text("ยืนยันการลบโน้ต", fontWeight = FontWeight.Bold, color = TextPrimary) },
                      text = { Text("ต้องการลบโน้ต "${note.title}" ใช่หรือไม่?", color = TextSecondary) },
                      confirmButton = {
                          Button(
                              onClick = {
                                  viewModel.deleteNote(note.id)
                                  noteToDelete = null
                              },
                              colors = ButtonDefaults.buttonColors(containerColor = StatusDanger),
                              shape = RoundedCornerShape(10.dp)
                          ) {
                              Text("ลบโน้ต", color = Color.White, fontWeight = FontWeight.SemiBold)
                          }
                      },
                      dismissButton = {
                          TextButton(onClick = { noteToDelete = null }) {
                              Text("ยกเลิก", color = TextSecondary)
                          }
                      },
                      containerColor = CardWhite,
                      shape = RoundedCornerShape(18.dp)
                  )
              }
          }
          
          @Composable
          private fun NoteCardItem(
              note: NoteModel,
              onClick: () -> Unit,
              onTogglePin: () -> Unit,
              onDelete: () -> Unit
          ) {
              Card(
                  modifier = Modifier
                      .fillMaxWidth()
                      .clip(RoundedCornerShape(14.dp))
                      .clickable { onClick() },
                  shape = RoundedCornerShape(14.dp),
                  colors = CardDefaults.cardColors(
                      containerColor = if (note.isPinned) IosOrangeLight else CardWhite
                  ),
                  elevation = CardDefaults.cardElevation(defaultElevation = 0.5.dp)
              ) {
                  Column(modifier = Modifier.padding(14.dp)) {
                      Row(
                          modifier = Modifier.fillMaxWidth(),
                          verticalAlignment = Alignment.CenterVertically,
                          horizontalArrangement = Arrangement.SpaceBetween
                      ) {
                          Row(
                              modifier = Modifier.weight(1f),
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              if (note.isPinned) {
                                  Icon(
                                      imageVector = Icons.Default.PushPin,
                                      contentDescription = "ปักหมุด",
                                      tint = IosOrange,
                                      modifier = Modifier
                                          .size(17.dp)
                                          .padding(end = 4.dp)
                                  )
                              }
                              Text(
                                  text = note.title,
                                  fontSize = 15.sp,
                                  fontWeight = FontWeight.Bold,
                                  color = TextPrimary,
                                  maxLines = 1,
                                  overflow = TextOverflow.Ellipsis
                              )
                          }
          
                          Row(verticalAlignment = Alignment.CenterVertically) {
                              IconButton(
                                  onClick = onTogglePin,
                                  modifier = Modifier.size(30.dp)
                              ) {
                                  Icon(
                                      imageVector = Icons.Default.PushPin,
                                      contentDescription = "ปักหมุด",
                                      tint = if (note.isPinned) IosOrange else IosSystemGray2,
                                      modifier = Modifier.size(18.dp)
                                  )
                              }
                              IconButton(
                                  onClick = onDelete,
                                  modifier = Modifier.size(30.dp)
                              ) {
                                  Icon(
                                      imageVector = Icons.Default.DeleteOutline,
                                      contentDescription = "ลบโน้ต",
                                      tint = StatusDanger,
                                      modifier = Modifier.size(19.dp)
                                  )
                              }
                          }
                      }
          
                      if (note.content.isNotBlank()) {
                          Spacer(modifier = Modifier.height(6.dp))
                          Text(
                              text = note.content,
                              fontSize = 13.sp,
                              color = TextSecondary,
                              maxLines = 5,
                              overflow = TextOverflow.Ellipsis,
                              lineHeight = 18.sp
                          )
                      }
          
                      Spacer(modifier = Modifier.height(8.dp))
                      Text(
                          text = "อัปเดต: ${Formatters.formatIsoDateTime(note.updatedAt)}",
                          fontSize = 11.sp,
                          color = TextMuted
                      )
                  }
              }
          }
          
          @Composable
          private fun NoteEditorDialog(
              initialNote: NoteModel?,
              onDismiss: () -> Unit,
              onSave: (title: String, content: String, isPinned: Boolean) -> Unit
          ) {
              var title by remember { mutableStateOf(initialNote?.title ?: "") }
              var content by remember { mutableStateOf(initialNote?.content ?: "") }
              var isPinned by remember { mutableStateOf(initialNote?.isPinned ?: false) }
          
              Dialog(onDismissRequest = onDismiss) {
                  Card(
                      shape = RoundedCornerShape(20.dp),
                      colors = CardDefaults.cardColors(containerColor = CardWhite),
                      modifier = Modifier
                          .fillMaxWidth()
                          .padding(8.dp)
                  ) {
                      Column(modifier = Modifier.padding(20.dp)) {
                          Text(
                              text = if (initialNote == null) "เพิ่มโน้ตใหม่" else "แก้ไขโน้ต",
                              fontSize = 18.sp,
                              fontWeight = FontWeight.Bold,
                              color = TextPrimary
                          )
          
                          Spacer(modifier = Modifier.height(14.dp))
          
                          OutlinedTextField(
                              value = title,
                              onValueChange = { title = it },
                              label = { Text("หัวข้อโน้ต") },
                              placeholder = { Text("เช่น รายการของต้องสั่งเพิ่ม / แจ้งกะเช้า") },
                              singleLine = true,
                              modifier = Modifier.fillMaxWidth(),
                              shape = RoundedCornerShape(10.dp)
                          )
          
                          Spacer(modifier = Modifier.height(10.dp))
          
                          OutlinedTextField(
                              value = content,
                              onValueChange = { content = it },
                              label = { Text("รายละเอียด") },
                              placeholder = { Text("พิมพ์ข้อความบันทึก...") },
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .heightIn(min = 140.dp, max = 260.dp),
                              maxLines = 10,
                              shape = RoundedCornerShape(10.dp)
                          )
          
                          Spacer(modifier = Modifier.height(10.dp))
          
                          Row(
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .clip(RoundedCornerShape(8.dp))
                                  .clickable { isPinned = !isPinned }
                                  .padding(vertical = 4.dp),
                              verticalAlignment = Alignment.CenterVertically,
                              horizontalArrangement = Arrangement.SpaceBetween
                          ) {
                              Text("ปักหมุดไว้ด้านบนสุด", fontSize = 14.sp, color = TextPrimary)
                              Switch(
                                  checked = isPinned,
                                  onCheckedChange = { isPinned = it },
                                  colors = SwitchDefaults.colors(
                                      checkedThumbColor = Color.White,
                                      checkedTrackColor = IosOrange,
                                      uncheckedThumbColor = Color.White,
                                      uncheckedTrackColor = IosSystemGray4
                                  )
                              )
                          }
          
                          Spacer(modifier = Modifier.height(18.dp))
          
                          Row(
                              modifier = Modifier.fillMaxWidth(),
                              horizontalArrangement = Arrangement.spacedBy(10.dp)
                          ) {
                              OutlinedButton(
                                  onClick = onDismiss,
                                  modifier = Modifier.weight(1f),
                                  shape = RoundedCornerShape(10.dp)
                              ) {
                                  Text("ยกเลิก")
                              }
          
                              Button(
                                  onClick = { onSave(title, content, isPinned) },
                                  enabled = title.isNotBlank() || content.isNotBlank(),
                                  colors = ButtonDefaults.buttonColors(containerColor = IosBlue),
                                  shape = RoundedCornerShape(10.dp),
                                  modifier = Modifier.weight(1f)
                              ) {
                                  Text("บันทึก", fontWeight = FontWeight.Bold, color = Color.White)
                              }
                          }
                      }
                  }
              }
          }
          EOF_FILE_CONTENT
          
          echo '📄 กำลังเขียนไฟล์ app/src/main/java/com/sitticun/orderapp/data/local/OrderDatabaseHelper.kt ...'
          cat << 'EOF_FILE_CONTENT' > "app/src/main/java/com/sitticun/orderapp/data/local/OrderDatabaseHelper.kt"
          package com.sitticun.orderapp.data.local
          
          import android.content.ContentValues
          import android.content.Context
          import android.database.Cursor
          import android.database.sqlite.SQLiteDatabase
          import android.database.sqlite.SQLiteOpenHelper
          import com.sitticun.orderapp.data.model.*
          import kotlinx.serialization.encodeToString
          import kotlinx.serialization.json.Json
          
          class OrderDatabaseHelper(context: Context) : SQLiteOpenHelper(context, DATABASE_NAME, null, DATABASE_VERSION) {
          
              private val json = Json { ignoreUnknownKeys = true }
          
              override fun onCreate(db: SQLiteDatabase) {
                  db.execSQL("""
                      CREATE TABLE outbox (
                          id INTEGER PRIMARY KEY AUTOINCREMENT,
                          action_type TEXT NOT NULL,
