name: Record existing Notes migration

# This push trigger allows the one-time workflow to run before the file is on
# the default branch. Only an intentional change to this file on this branch runs it.
on:
  workflow_dispatch:
  push:
    branches:
      - fix/offline-data-reliability
    paths:
      - .github/workflows/repair-notes-history.yml

permissions:
  contents: read

concurrency:
  group: ordernew-notes-history-repair
  cancel-in-progress: false

jobs:
  repair:
    name: Validate Ordernew and record Notes migration
    if: github.repository == 'purinus0341-ai/Order' && github.ref == 'refs/heads/fix/offline-data-reliability'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Checkout reviewed branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate required configuration
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] || [ -z "${SUPABASE_DB_PASSWORD:-}" ]; then
            echo '::error::Set SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD as repository secrets, then rerun this job.'
            exit 1
          fi
          printf '%s  %s\n' 'c5762d63b1d541797b74cc67ea18fa2b79a4b5ebcc50baef167175865c6a3e7f' 'supabase/migrations/20261106011919_notes_server_revision.sql' | sha256sum -c -

      - name: Verify existing Notes schema (read-only)
        run: python3 .github/scripts/verify_notes_schema.py

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.39.2

      - name: Link Ordernew and inspect migration history
        shell: bash
        run: |
          set -euo pipefail
          supabase link --project-ref pafgvntgilogmxfrjamp --password "$SUPABASE_DB_PASSWORD" --yes
          supabase migration list --linked --password "$SUPABASE_DB_PASSWORD"

      - name: Record existing migration without running its SQL
        shell: bash
        run: |
          set -euo pipefail
          supabase migration repair 20261106011919 --status applied --linked --password "$SUPABASE_DB_PASSWORD" --yes
          supabase migration list --linked --password "$SUPABASE_DB_PASSWORD"
